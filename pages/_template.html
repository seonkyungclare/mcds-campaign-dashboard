  <!-- 라디오/체크박스 등 상호작용이 필요하면 아래 공용 헬퍼 사용 (불필요하면 삭제)
  <script>
    // 라디오: 빈 span .radio__dot 에 data-on 토글 (CSS가 원을 그림)
    function setDot(dot, on){ if(dot){ on ? dot.setAttribute('data-on','') : dot.removeAttribute('data-on'); } }
    document.querySelectorAll('[data-radio]').forEach(function(el){
      if (el.disabled) return;
      el.addEventListener('click', function(){
        var g = el.getAttribute('data-radio');
        document.querySelectorAll('[data-radio="'+g+'"]').forEach(function(p){
          var sel = p===el;
          p.setAttribute('aria-checked', sel?'true':'false');
          setDot(p.querySelector('.radio__dot'), sel);
          if (p.classList.contains('radio-card')) p.classList.toggle('radio-card--selected', sel);
        });
      });
    });
    // 체크박스: aria-checked 토글 (CSS가 체크 표시)
    document.querySelectorAll('[data-check]').forEach(function(el){
      el.addEventListener('click', function(){
        if (el.disabled) return;
        el.setAttribute('aria-checked', el.getAttribute('aria-checked')==='true'?'false':'true');
      });
    });
  </script>
  -->
