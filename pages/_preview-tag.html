<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCDS Tag 미리보기</title>
<link rel="stylesheet" href="mcds.css" />
<style>
  body { padding: 32px; background: #fff; min-width: 0; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  .swatch { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<h1>MCDS Tag (.tag)</h1>
<div class="swatch">
  <span class="tag tag--gray">gray</span>
  <span class="tag tag--blue">blue</span>
  <span class="tag tag--green">green</span>
  <span class="tag tag--red">red</span>
  <span class="tag tag--yellow">yellow</span>
  <span class="tag tag--purple">purple</span>
</div>
<div class="swatch" style="margin-top:20px;">
  <span class="tag tag--green">진행중</span>
  <span class="tag tag--gray">종료</span>
  <span class="tag tag--red">중단</span>
  <span class="tag tag--yellow">검수중</span>
  <span class="tag tag--blue">신규</span>
  <span class="tag tag--purple">프리미엄</span>
</div>
</body>
</html>
