          organic: [
            ['개인화 자동 노출','추천 로직이 유저마다 알맞게 자동으로 적용됩니다.'],
            ['상시 노출','후순위 슬롯에서 자연스럽게 상시노출됩니다.'],
            ['성과 기반','비용 없이, 성과가 좋을수록 더 많이 노출됩니다.']
          ]
        }
      }
    };

    function renderInfo(adType, pid){
      var cfg = PURCHASE[adType];
      var rows = cfg.info[pid] || cfg.info[cfg.def];
      document.getElementById('infoRow').innerHTML = rows.map(function(it,i){
        return '<div class="info__item">'+gicon(i)+
          '<div class="info__text"><p class="info__title">'+it[0]+'</p><p class="info__desc">'+it[1]+'</p></div></div>';
      }).join('');
    }

    function selectPurchase(adType, pid){
      document.querySelectorAll('#purchaseCards .radio-card').forEach(function(c){
        var on = c.getAttribute('data-pid') === pid;
        c.classList.toggle('radio-card--selected', on);
        c.setAttribute('aria-checked', on ? 'true' : 'false');
        setDot(c.querySelector('.radio__dot'), on);
      });
      renderInfo(adType, pid);
    }

    function renderPurchase(adType){
      var cfg = PURCHASE[adType];
      var wrap = document.getElementById('purchaseCards');
      wrap.innerHTML = cfg.cards.map(function(c){
        var sel = c.id === cfg.def && !c.disabled;
        var badge = c.badge ? '<span class="tag tag--gray">'+c.badge+'</span>' : '';
        return '<button type="button" class="radio-card'+(sel?' radio-card--selected':'')+(c.disabled?' radio-card--disabled':'')+
          '" role="radio" aria-checked="'+(sel?'true':'false')+'"'+(c.disabled?' aria-disabled="true"':'')+' data-pid="'+c.id+'">'+
          '<div class="radio-card__head"><span class="radio__dot'+(sel?'" data-on':'"')+'></span>'+
          '<span class="radio-card__title">'+c.title+'</span>'+badge+'</div>'+
          '<p class="radio-card__desc">'+c.desc+'</p></button>';
      }).join('');
      wrap.querySelectorAll('.radio-card').forEach(function(c){
        if (c.classList.contains('radio-card--disabled')) return;
        c.addEventListener('click', function(){ selectPurchase(adType, c.getAttribute('data-pid')); });
      });
      selectPurchase(adType, cfg.def);
    }

    // 광고유형 라디오 → 구매유형/ info 재구성
    document.querySelectorAll('[data-radio="adtype"]').forEach(function(el){
      el.addEventListener('click', function(){
        document.querySelectorAll('[data-radio="adtype"]').forEach(function(peer){
          var selected = peer === el;
          peer.setAttribute('aria-checked', selected ? 'true' : 'false');
          setDot(peer.querySelector('.radio__dot'), selected);
        });
        renderPurchase(el.getAttribute('data-value'));
      });
    });

    renderPurchase('ad'); // 기본: 광고 → 보장형

    (function () {
      var input = document.querySelector('.textfield__input');
      var count = document.getElementById('nameCount');
      if (input && count) count.textContent = input.value.length;
    })();
  </script>

  <!-- 생성 완료 알럿 (CTA 클릭 시) -->
  <div class="overlay" id="createAlert" hidden>
    <div class="alert" role="alertdialog" aria-modal="true" aria-labelledby="createAlertTitle">
      <div class="alert__text">
        <span class="alert__title" id="createAlertTitle">입력하신 정보로 새 캠페인을 생성했습니다.<br>이어서 광고 그룹을 만들까요?</span>
      </div>
      <div class="alert__actions">
        <button type="button" class="btn btn--secondary btn--36" onclick="location.href='dsp-home.html?tab=camp'">나가기</button>
        <button type="button" class="btn btn--primary btn--36" onclick="location.href='ad-group-create.html'">이어서 광고 그룹 만들기</button>
      </div>
    </div>
  </div>
  <script>
    function openCreateAlert(){ document.getElementById('createAlert').hidden = false; }
    function closeCreateAlert(){ document.getElementById('createAlert').hidden = true; }
    (function () {
      var ov = document.getElementById('createAlert');
      ov.addEventListener('mousedown', function (e) { if (e.target === ov) closeCreateAlert(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) closeCreateAlert(); });
    })();
  </script>

  <!-- 취소 → 나가기 확인 알럿 (계속 작성=닫고 편집 계속 / 나가기=닫고 편집 내용 폐기) -->
  <div class="overlay" id="cancelAlert" hidden>
    <div class="alert" role="alertdialog" aria-modal="true" aria-labelledby="cancelAlertTitle">
      <div class="alert__text">
        <span class="alert__title" id="cancelAlertTitle">입력중인 내용이 있습니다.<br>저장하지 않은 내용은 모두 사라집니다.</span>
        <span class="alert__desc">수정하지 않고 나가시겠습니까?</span>
      </div>
      <div class="alert__actions">
        <button type="button" class="btn btn--secondary btn--36" onclick="closeCancelAlert()">계속 작성</button>
        <button type="button" class="btn btn--primary btn--36" onclick="location.href='dsp-home.html'">나가기</button>
      </div>
    </div>
  </div>
  <script>
    function openCancelAlert(){ document.getElementById('cancelAlert').hidden = false; }
    function closeCancelAlert(){ document.getElementById('cancelAlert').hidden = true; }
    (function () {
      var ov = document.getElementById('cancelAlert');
      ov.addEventListener('mousedown', function (e) { if (e.target === ov) closeCancelAlert(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) closeCancelAlert(); });
    })();
  </script>
</body>
</html>
