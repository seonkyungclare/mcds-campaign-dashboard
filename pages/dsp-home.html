<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MCDS 기반 디스플레이 광고 관리 홈(현황)" />
  <meta name="theme-color" content="#2b52f0" />
  <title>디스플레이 광고 관리</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="mcds.css?v=20260813c" />
  <style>
    /* ===== 디스플레이 광고 관리 홈 — Figma 디자인 기준 (MCDS 토큰) ===== */
    .dh { display: flex; flex-direction: column; gap: 24px; padding: 32px; width: 100%; }
    .dh * { box-sizing: border-box; }

    .dh__title { font-size: 24px; line-height: 34px; font-weight: 700; color: var(--fg-default); }
    .dh__acct { display: flex; align-items: center; gap: 6px; }
    .dh__acct-name { font-size: 18px; line-height: 26px; font-weight: 600; color: var(--fg-default); }
    .dh__acct-btn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 1px solid var(--border); border-radius: var(--r-4); background: #fff; cursor: pointer; }

    .dh__sec-head { display: flex; align-items: center; justify-content: space-between; }
    .dh__sec-title { font-size: 18px; line-height: 26px; font-weight: 600; color: var(--fg-default); }
    .dh__hint { font-size: 12px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 4px; }

    /* 기간 / 비교 바 */
    .dh__bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .dh__daterow { display: flex; align-items: center; gap: 10px; }
    .dh__date { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-4); background: #fff; font-size: 14px; color: var(--fg-default); }
    .dh__date svg { color: var(--fg-muted); }
    .dh__vs { font-size: 13px; color: var(--fg-muted); }
    .dh__baractions { display: flex; align-items: center; gap: 8px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-4); overflow: hidden; }
    .seg button { border: 0; background: #fff; height: 34px; padding: 0 12px; font-size: 13px; font-weight: 500; color: var(--fg-subtle); cursor: pointer; font-family: inherit; border-left: 1px solid var(--border); }
    .seg button:first-child { border-left: 0; }
    .seg button.on { background: var(--accent-light-low); color: var(--accent); font-weight: 600; }
    .lbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-4); background: #fff; font-size: 13px; font-weight: 500; color: var(--fg-default); cursor: pointer; font-family: inherit; }

    /* 지표 카드 */
    .dh__cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    @media (max-width: 1400px) { .dh__cards { grid-template-columns: repeat(3, 1fr); } }
    .mcard { border: 1px solid var(--border); border-radius: var(--r-8); background: #fff; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
    .mcard__top { display: flex; align-items: center; justify-content: space-between; }
    .mcard__k { font-size: 13px; color: var(--fg-subtle); font-weight: 500; }
    .mcard__more { color: var(--fg-muted); cursor: pointer; line-height: 0; }
    .mcard__v { font-size: 22px; line-height: 30px; font-weight: 700; color: var(--fg-default); }
    .mcard__v small { font-size: 13px; font-weight: 500; color: var(--fg-muted); margin-left: 2px; }
    .mcard__d { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; border-radius: var(--r-4); padding: 2px 7px; width: fit-content; }
    .d-up { color: var(--accent); background: var(--accent-light-low); }
    .d-down { color: #e5231b; background: #fdeaec; }
    .d-flat { color: var(--fg-muted); background: var(--fill-light-lower); }

    /* 차트 */
    .dh__panel { border: 1px solid var(--border); border-radius: var(--r-8); background: #fff; padding: 20px; }
    .dh__chart-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
    .dh__metricsel { display: flex; align-items: center; gap: 12px; }
    .msel { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--fg-default); }
    .msel .dot { width: 8px; height: 8px; border-radius: 50%; }
    .msel select { height: 30px; border: 1px solid var(--border); border-radius: var(--r-4); font-size: 13px; padding: 0 6px; color: var(--fg-default); background: #fff; font-family: inherit; }
    .dot.o { background: #ec6f2d; } .dot.b { background: var(--accent); }
    .dh__legend { display: flex; gap: 14px; font-size: 12px; color: var(--fg-muted); margin-bottom: 6px; }
    .dh__legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--fg-muted); margin-right: 5px; vertical-align: middle; }
    .dh__legend i.dash { border-top-style: dashed; }
    .chartwrap { position: relative; }
    svg.chart { width: 100%; height: 300px; display: block; }
    .yg { stroke: var(--border-light); stroke-width: 1; }
    .xlab, .ylab { font-size: 10px; fill: var(--fg-muted); }
    #guide { stroke: #c4c9d0; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
    .tip { position: absolute; top: 8px; transform: translateX(-50%); background: #fff; border: 1px solid var(--border); border-radius: var(--r-8); box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: 11px 13px; font-size: 12px; min-width: 190px; pointer-events: none; opacity: 0; transition: opacity .08s; z-index: 5; }
    .tip .td { font-weight: 700; margin-bottom: 8px; }
    .tip .trow { margin-bottom: 7px; } .tip .trow:last-child { margin-bottom: 0; }
    .tip .tm { display: flex; align-items: center; gap: 5px; font-weight: 600; margin-bottom: 3px; }
    .tip .tl { display: flex; justify-content: space-between; color: var(--fg-subtle); }
    .tip .tl b { color: var(--fg-default); }

    /* Step/Tab 내비 (캠페인 › 광고그룹 › 광고) */
    .stepnav { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-light); }
    .stepnav__group { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-bottom: 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .stepnav__group.on { border-bottom-color: var(--accent); }
    .stepnav__item { background: none; border: 0; padding: 0; font-size: 16px; line-height: 24px; font-weight: 500; color: var(--fg-default); cursor: pointer; font-family: inherit; }
    .stepnav__group.on .stepnav__item { color: var(--accent); }
    .stepnav__sep { color: var(--fg-muted); display: inline-flex; align-items: center; height: 40px; padding-bottom: 12px; }
    .stepnav__chip { cursor: default; }
    .stepnav__chip[hidden] { display: none; }  /* .chip의 display가 [hidden]을 덮어써 0건에도 보이던 문제 */

    /* 툴바 */
    .dh__toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .dh__toolbar .spacer { flex: 1; }
    .tbtn { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--r-4); background: #fff; font-size: 14px; font-weight: 600; color: var(--fg-default); cursor: pointer; font-family: inherit; }
    .tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tbtn.primary:hover { background: var(--accent-hovered); }
    .tsearch { display: inline-flex; align-items: center; gap: 7px; height: 36px; border: 1px solid var(--border); border-radius: var(--r-4); padding: 0 10px; min-width: 300px; background: #fff; }
    .tsearch input { border: 0; outline: 0; font-size: 13px; width: 100%; background: transparent; font-family: inherit; }
    .tsearch svg { color: var(--fg-muted); flex: none; }
    .tsel { height: 36px; border: 1px solid var(--border); border-radius: var(--r-4); padding: 0 8px; font-size: 13px; background: #fff; color: var(--fg-default); font-family: inherit; }
    .dh__bulk { display: none; align-items: center; gap: 10px; background: var(--accent-light-low); border: 1px solid var(--blue-90); border-radius: var(--r-8); padding: 9px 13px; font-size: 13px; }
    .dh__bulk.show { display: flex; } .dh__bulk b { color: var(--accent); }

    /* 테이블 셀 콘텐츠 — 구조/페이지네이션은 mcds.css의 .mcds-table / .pagination 사용 */
    .idtxt { color: var(--fg-muted); }
    .abtn { border: 1px solid var(--border); background: #fff; border-radius: var(--r-4); padding: 5px 9px; font-size: 12px; font-weight: 500; color: var(--fg-subtle); cursor: pointer; white-space: nowrap; }
    .abtn:hover { border-color: var(--border-light-lower-hovered); }
    /* 토글 (cellType=switch) */
    .tg { width: 34px; height: 20px; border-radius: 20px; background: #d1d6db; position: relative; display: inline-block; cursor: pointer; vertical-align: middle; }
    .tg.on { background: var(--accent); }
    .tg::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .12s; }
    .tg.on::after { left: 16px; }
    /* 상태 뱃지 (cellType=tag) */
    .stat { font-size: 12px; font-weight: 600; border-radius: var(--r-4); padding: 3px 8px; display: inline-block; white-space: nowrap; }
    .stat-live { color: var(--accent); background: var(--accent-light-low); }
    .stat-wait { color: #1d4ed8; background: #eaf0ff; }
    .stat-del { color: #e5231b; background: #fdeaec; }
    .stat-pause { color: #9a6a00; background: #fff6e9; }
    .stat-end { color: var(--fg-muted); background: var(--fill-light-lower); }
    .stat-draft { color: #7c3aed; background: #f3ecff; }
    .rv-appr { color: #0a8f52; background: #e7f7ef; } .rv-rej { color: #e5231b; background: #fdeaec; }
  </style>
</head>

    const svg=document.getElementById('chart');
    // 실제 컨테이너 픽셀 폭에 맞춰 viewBox를 잡아, 좌우 늘어남(왜곡) 없이 렌더
    const wrap=document.getElementById('chartwrap');
    CW=Math.round(wrap?.clientWidth||svg.clientWidth||1000)||1000;
    svg.setAttribute('viewBox',`0 0 ${CW} ${CH}`);
    const m1=METRICS[g1], m2=METRICS[g2];
    const mx1=Math.max(...m1.cur,...m1.prev)*1.15, mx2=Math.max(...m2.cur,...m2.prev)*1.15;
    let out='';
    for(let i=0;i<=4;i++){ const y=PADT+(CH-PADT-PADB)*i/4; out+=`<line class="yg" x1="${PADL}" y1="${y}" x2="${CW-PADR}" y2="${y}"/>`; }

    // 지표2 (파랑) — 비교 뒤, 조회 앞
    out+=polyline(m2.prev,mx2,'#2b52f0',true)+polyline(m2.cur,mx2,'#2b52f0',false)+dots(m2.cur,mx2,'#2b52f0');
    // 지표1 (주황)
    out+=polyline(m1.prev,mx1,'#ec6f2d',true)+polyline(m1.cur,mx1,'#ec6f2d',false)+dots(m1.cur,mx1,'#ec6f2d');

    svg.innerHTML=out;
  }
  function initHover(){
    const svg=document.getElementById('chart'), tip=document.getElementById('tip');

      const r=svg.getBoundingClientRect(), x=e.clientX-r.left;
      const slot=r.width*((CW-PADL-PADR)/(N-1)/CW), left0=r.width*(PADL/CW);
      let i=Math.round((x-left0)/slot); i=Math.max(0,Math.min(N-1,i));
      const vbX=px(i), g=document.getElementById('guide');
      if(g){ g.setAttribute('x1',vbX); g.setAttribute('x2',vbX); g.style.opacity=1; }
      let html=`<div class="td">${XS[i]} · 기준일</div>`;
      [[g1,'o'],[g2,'b']].forEach(([k,dc])=>{

      });
      tip.innerHTML=html;
      let lp=r.width*(vbX/CW); const tw=200; lp=Math.max(tw/2,Math.min(r.width-tw/2,lp));
      tip.style.left=lp+'px'; tip.style.opacity=1;
    });
    svg.addEventListener('mouseleave',()=>{ tip.style.opacity=0; const g=document.getElementById('guide'); if(g) g.style.opacity=0; });
  }

    document.getElementById('createBtn').textContent=d.create;
    const chk='<button type="button" class="checkbox" role="checkbox" aria-checked="false" id="chkall" onclick="toggleAll()">'+CB_BOX+'</button>';
    document.getElementById('thead').innerHTML='<tr><th class="mcds-table__sel">'+chk+'</th>'+d.head.map((h,i)=>`<th class="${d.numcols.includes(i)?'mcds-table__num':''}">${h}</th>`).join('')+'</tr>';
    document.getElementById('tbody').innerHTML = d.rows.map((r,ri)=>
      '<tr><td class="mcds-table__sel"><button type="button" class="checkbox rowchk" role="checkbox" aria-checked="false" data-idx="'+ri+'" onclick="toggleRow(this)">'+CB_BOX+'</button></td>'+
      r.map((c,i)=>`<td class="${d.numcols.includes(i)?'mcds-table__num':''}">${c}</td>`).join('')+'</tr>'
    ).join('');
    // 선택 상태 복원(탭 이동과 무관하게 유지)
    document.querySelectorAll('#tbody .rowchk').forEach(el=>{ if(SEL[curTab].has(+el.dataset.idx)) cbSet(el,true); });
    onCheck();
  }
  // MCDS 체크박스(박스 + 체크 SVG). 표시 여부는 aria-checked / .checkbox--checked 로 CSS가 제어.
  const CB_BOX='<span class="checkbox__box"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2 4.7 8.9 10 3.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  const cbOn=el=>el.getAttribute('aria-checked')==='true';
  function cbSet(el,v){ el.setAttribute('aria-checked', v?'true':'false'); el.classList.toggle('checkbox--checked', v); el.classList.remove('checkbox--indeterminate'); }
  // 스텝별 선택 항목(행 인덱스). 탭 이동과 무관하게 유지. camp→grp→ad 종속.
  const SEL={camp:new Set(),grp:new Set(),ad:new Set()};
  const STEP_ORDER=['camp','grp','ad'];
  function toggleRow(el){ const v=!cbOn(el); cbSet(el,v); const i=+el.dataset.idx; if(v)SEL[curTab].add(i);else SEL[curTab].delete(i); onCheck(); }
  function toggleAll(){
    const head=document.getElementById('chkall');
    const target=!head.classList.contains('checkbox--checked'); // 전체선택 아님 → 전체 체크
    document.querySelectorAll('#tbody .rowchk').forEach(c=>{ cbSet(c,target); const i=+c.dataset.idx; if(target)SEL[curTab].add(i);else SEL[curTab].delete(i); });
    onCheck();
  }
  function onCheck(){
    const rows=[...document.querySelectorAll('#tbody .rowchk')];
    // 선택된 행 하이라이트 (MCDS Table .is-selected)
    rows.forEach(c=>c.closest('tr').classList.toggle('is-selected', cbOn(c)));
    const n=SEL[curTab].size;
    document.getElementById('selCnt').textContent=n;
    document.getElementById('bulkbar').classList.toggle('show',n>0);
    // 전체선택 헤더 상태(현재 보이는 행 기준): none / indeterminate(일부) / all
    const vis=rows.filter(cbOn).length;
    const head=document.getElementById('chkall');
    if(head){
      const all=rows.length>0 && vis===rows.length, some=vis>0 && !all;
      head.classList.toggle('checkbox--checked', all);
      head.classList.toggle('checkbox--indeterminate', some);
      head.setAttribute('aria-checked', all?'true':(some?'mixed':'false'));
    }
    updateChips();
  }
  // 스텝 라벨 옆 "N건 선택 ✕" 칩 갱신. 활성 스텝=accent, 그 외=low.
  function updateChips(){
    STEP_ORDER.forEach(t=>{
      const chip=document.querySelector('.stepnav__chip[data-chip="'+t+'"]');
      if(!chip) return;
      const cnt=SEL[t].size;
      chip.hidden = cnt===0;
      chip.querySelector('.stepnav__chip-cnt').textContent=cnt;
      chip.classList.toggle('chip--accent', t===curTab);
      chip.classList.toggle('chip--low', t!==curTab);
    });
  }
  // 칩 ✕: 해당 스텝 초기화 + 종속 하위 스텝(이후 단계)도 함께 초기화.
  function clearSel(t){
    const from=STEP_ORDER.indexOf(t);
    const affected=STEP_ORDER.slice(from);
    affected.forEach(k=>SEL[k].clear());
    if(affected.includes(curTab)){
      document.querySelectorAll('#tbody .rowchk').forEach(el=>cbSet(el,false));
    }
    onCheck();
  }

  /* ================= init / events ================= */
  renderCards();
  fillSel('g1sel',g1); fillSel('g2sel',g2);
  document.getElementById('g1sel').addEventListener('change',e=>{ g1=e.target.value; renderChart(); });
  document.getElementById('g2sel').addEventListener('change',e=>{ g2=e.target.value; renderChart(); });
  document.querySelectorAll('#cmpSeg button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#cmpSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  }));
  document.querySelectorAll('.stepnav__item').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  // '캠페인 만들기' → 현재 탭 생성 페이지 (캠페인 → campaign-create.html)
  document.getElementById('createBtn').addEventListener('click',()=>{ location.href=CREATE_LINK[curTab]; });
  renderChart(); initHover(); setTab('camp');
  // 컨테이너 폭 변경 시 차트 재렌더(폭 기준 좌표 갱신)
  let _rz; window.addEventListener('resize',()=>{ clearTimeout(_rz); _rz=setTimeout(renderChart,120); });
  </script>
</body>
</html>
